"on":
    push:
        branches:
            - main
name: Deploy to ha-proxy
jobs:
    porter-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.1.0
            - name: Deploy stack
              timeout-minutes: 30
              run: porter apply -f porter.yaml
              env:
                PORTER_APP_NAME: ha-proxy
                PORTER_CLUSTER: "5674"
                PORTER_DEPLOYMENT_TARGET_ID: 474e1a86-695a-425d-b45c-b9aaf510892f
                PORTER_HOST: https://dashboard.porter.run
                PORTER_PROJECT: "18131"
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
                PORTER_TOKEN: ${{ secrets.PORTER_APP_18131_17025 }}
